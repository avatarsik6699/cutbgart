# Generated by scripts/release/deploy.sh on production. These local defaults
# keep Docker Compose usable without claiming a production release identity.
add_header X-Cutbg-Build-Id "local" always;
add_header X-Cutbg-Commit "unknown" always;
add_header X-Cutbg-Image-Digest "sha256:local" always;
add_header X-Cutbg-Created-At "1970-01-01T00:00:00Z" always;
